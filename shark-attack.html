<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Shark Attack</title>
    <style>
      :root {
        --water-dark: #063f5d;
        --water-mid: #0f6996;
        --water-light: #3fb0d6;
        --wall: #08283d;
        --wall-2: #041f31;
        --reef: #15435b;

        --you: #ff6f5a;

        --tile-line: rgba(255, 255, 255, 0.06);
        --shark-size: 240%;

        --fish-art: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTIwIiBmaWxsPSJub25lIj4KICA8ZWxsaXBzZSBjeD0iNzAiIGN5PSI2MCIgcng9IjQyIiByeT0iMjQiIGZpbGw9IiMyMmQzZWUiLz4KICA8ZWxsaXBzZSBjeD0iNzAiIGN5PSI2MCIgcng9IjM0IiByeT0iMTgiIGZpbGw9IiMwZWE1ZTkiLz4KICA8ZWxsaXBzZSBjeD0iOTYiIGN5PSI2MCIgcng9IjEyIiByeT0iMTIiIGZpbGw9IiMwNmI2ZDQiLz4KICA8cGF0aCBkPSJNNTIgNTJMMjYgNDRMMjIgNTBMNTAgNTIiIGZpbGw9IiM2N2U4ZjkiLz4KICA8cGF0aCBkPSJNODIgNDhMMTE4IDQ0TDExOCA2MEw4MiA1NloiIGZpbGw9IiM2N2U4ZjkiLz4KICA8cGF0aCBkPSJNMTE4IDU0TDE1MCA0N0wxNDQgNThMMTE4IDU4WiIgZmlsbD0iIzA2YjZkNCIvPgogIDxjaXJjbGUgY3g9Ijc4IiBjeT0iNTkiIHI9IjMiIGZpbGw9IiMwODJmNDkiLz4KICA8cGF0aCBkPSJNNjQgNjBRNjYgNTIgNzIgNTIiIHN0cm9rZT0iIzBjNGE2ZSIgc3Ryb2tlLXdpZHRoPSIyLjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPgogIDxwYXRoIGQ9Ik0xMjIgNjBDMTMyIDYwIDEzMiA0NCAxNDQgNDRDMTU2IDQ0IDE1NiA3NiAxNDQgNzZDMTMyIDc2IDEzMiA2MCAxMjIgNjBaIiBmaWxsPSIjNGZjM2Y3Ii8+CiAgPHBhdGggZD0iTTE1MCA2MEMxNjQgNTggMTcwIDYwIDE3NiA2MUMxNzYgNTkgMTcwIDU2IDE1NiA1NloiIGZpbGw9IiM2N2U4ZjkiLz4KPC9zdmc+");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      html {
        overflow-y: auto;
        overscroll-behavior: auto;
      }

      body {
        font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
        color: #f2f8ff;
        display: grid;
        place-items: center;
        padding: 8px;
        overflow-y: auto;
        background:
          radial-gradient(circle at 20% 0, rgba(255, 255, 255, 0.18), transparent 35%),
          radial-gradient(circle at 100% 24%, rgba(255, 255, 255, 0.12), transparent 34%),
          linear-gradient(180deg, var(--water-light), #02688d 36%, var(--water-dark));
        height: auto;
        touch-action: pan-y;
        -webkit-text-size-adjust: 100%;
      }

      .wrap {
        width: min(1220px, 98vw);
        min-height: min-content;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 6px;
        padding-inline: 12px;
      }

      .title {
        text-align: center;
        margin: 0;
        font-size: clamp(22px, 4.8vw, 40px);
        letter-spacing: 0.7px;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.36);
      }

      .hud {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        justify-content: space-between;
        align-items: stretch;
        width: 100%;
      }

      .details-below {
        margin-top: 4px;
        color: #f5f8ff;
        text-align: center;
        font-size: 11px;
        line-height: 1.1;
        min-height: 1.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .panel {
        min-width: 0;
        background: linear-gradient(180deg, rgba(8, 28, 44, 0.92), rgba(8, 23, 34, 0.92));
        border: 2px solid #3bc9dd;
        border-radius: 12px;
        padding: 4px 6px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      }

      .panel .label {
        font-size: 10px;
        color: #def1ff;
        margin-bottom: 2px;
      }

      .panel .value {
        color: var(--glow);
        font-size: 14px;
        font-weight: 700;
      }

      .actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      .actions .btn {
        flex: 1 1 120px;
        min-height: 34px;
      }

      .btn {
        border: 0;
        border-radius: 14px;
        padding: 8px 10px;
        color: #07293b;
        font-weight: 700;
        background: linear-gradient(180deg, #3cd5ff, #2c9ed6);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
      }

      .btn:hover {
        filter: brightness(1.07);
      }

      .board-wrap {
        position: relative;
        overflow: auto;
        border: 4px solid #f2d07a;
        border-radius: 22px;
        padding: 6px;
        background: linear-gradient(180deg, rgba(7, 44, 70, 0.94), rgba(5, 24, 39, 0.94));
        box-shadow:
          inset 0 0 0 3px rgba(255, 255, 255, 0.08),
          0 14px 32px rgba(0, 0, 0, 0.45);
        touch-action: none;
      }

      .board {
        width: 100%;
        justify-content: center;
        align-items: center;
      }

      .board {
        display: grid;
        margin: 0 auto;
        gap: 0;
        position: relative;
      }

      .tile {
        width: var(--size);
        height: var(--size);
        position: relative;
        border: 1px solid var(--tile-line);
        overflow: hidden;
      }

      .tile.wall {
        background: repeating-linear-gradient(50deg, var(--wall), var(--wall) 5px, var(--wall-2) 5px, var(--wall-2) 10px),
          linear-gradient(180deg, #0b3048, #07334d);
      }

      .tile.path {
        background:
          radial-gradient(circle at 25% 16%, rgba(255, 255, 255, 0.08), transparent 35%),
          linear-gradient(180deg, rgba(10, 114, 154, 0.95), rgba(8, 84, 121, 0.94) 50%, rgba(9, 68, 100, 0.9));
        border-radius: 2px;
      }

      .tile.path.path-soft {
        background:
          radial-gradient(circle at 36% 24%, rgba(255, 255, 255, 0.16), transparent 34%),
          linear-gradient(180deg, rgba(11, 124, 169, 0.95), rgba(9, 90, 128, 0.95) 50%, rgba(10, 72, 105, 0.92));
      }

      .tile.path.path-glow {
        background:
          radial-gradient(circle at 68% 18%, rgba(255, 240, 180, 0.2), transparent 34%),
          linear-gradient(180deg, rgba(13, 118, 165, 0.95), rgba(9, 84, 123, 0.95) 50%, rgba(11, 74, 113, 0.92));
      }

      .tile.hidden {
        background: linear-gradient(180deg, rgba(3, 24, 37, 0.95), rgba(2, 18, 29, 0.95));
        box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.95);
      }

      .entity {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center;
        width: var(--shark-size);
        height: var(--shark-size);
        background-repeat: no-repeat;
        background-size: 98%;
        background-position: center;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      }

      .tile.you .entity {
        width: var(--shark-size);
        height: var(--shark-size);
        background-image: var(--active-shark-art, var(--shark-art));
        border: 0;
        border-radius: 0;
        clip-path: none;
        animation: bob 1.1s ease-in-out infinite;
      }

      .tile.you-tiger .entity {
        filter: saturate(1.12);
      }

      .tile.you-bull .entity {
        filter: saturate(1.15);
      }

      .tile.you-greatWhite .entity {
        filter: brightness(1.1);
      }

      .tile.you-hammerhead .entity {
        filter: contrast(1.05);
      }

      .tile.you-lemon .entity {
        filter: brightness(1.12) saturate(1.2);
      }

      .tile.you .entity::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform: scale(0);
      }

      .tile.you .entity::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform: scale(0);
      }

      .tile.fish .entity {
        width: var(--fish-size);
        height: var(--fish-size);
        background-image: var(--fish-art);
        border: 0;
        border-radius: 0;
        clip-path: none;
        animation: pulse 0.8s ease-in-out infinite;
      }

      .tile.fish.red .entity {
        filter: drop-shadow(0 4px 6px rgba(200, 0, 0, 0.35));
      }

      .tile.orca .entity {
        width: var(--orca-size);
        height: var(--orca-size);
        border: 0;
        border-radius: 48% 52% 42% 58% / 58% 48% 52% 42%;
        background: linear-gradient(180deg, #f7fbff 0 35%, #121722 35% 55%, #b3b9c6 55% 70%, #10131b 70%),
          radial-gradient(circle at 32% 45%, #eef2f9 0 12%, #d6dde5 20%, transparent 20.5%);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        filter: none;
        animation: bob 1.05s ease-in-out infinite;
      }

      .tile.orca .entity::before {
        content: "";
        position: absolute;
        width: 12px;
        height: 8px;
        left: 50%;
        top: 34%;
        transform: translateX(-20%) rotate(-20deg);
        border-radius: 50% 35% 45% 65%;
        background: #111;
        box-shadow: 18px 0 0 #111;
      }

      .tile.orca .entity::after {
        content: "";
        position: absolute;
        left: 16%;
        top: 54%;
        width: 38%;
        height: 20%;
        border-radius: 46% 60% 30% 46%;
        background: #0f1117;
        transform: rotate(24deg);
      }

      .tile.fish .entity::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        left: 0;
        top: 0;
        transform: scale(0);
      }

      .tile.fish .entity::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        left: 0;
        top: 0;
        transform: scale(0);
      }

      .tile.you .shield {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #80ffbf;
        box-shadow: 0 0 10px rgba(122, 255, 206, 0.8);
      }

      .screen {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
        place-items: center;
        background: rgba(3, 17, 31, 0.75);
        border-radius: 12px;
        animation: fadeIn 0.2s ease-out;
        text-align: center;
      }

      .screen.show {
        display: grid;
      }

      .panel-card {
        background: linear-gradient(180deg, rgba(12, 30, 47, 0.95), rgba(11, 19, 30, 0.95));
        border: 2px solid #4ce0ff;
        border-radius: 14px;
        max-width: min(680px, 92vw);
        width: 100%;
        padding: 12px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.5);
      }

      .panel-card h2,
      .panel-card p {
        margin: 0 0 6px;
      }

      .shark-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        margin: 6px 0 8px;
      }

      .shark-btn {
        border: 2px solid transparent;
        border-radius: 12px;
        color: #f1f7ff;
        background: linear-gradient(180deg, rgba(13, 44, 70, 0.95), rgba(7, 22, 34, 0.95));
        padding: 8px;
        font-family: inherit;
        cursor: pointer;
        font-size: 12px;
        text-align: left;
      }

      .shark-btn.selected {
        border-color: #9de2ff;
        box-shadow: 0 0 0 2px rgba(79, 205, 242, 0.4);
      }

      .shark-title {
        font-weight: 700;
        font-size: 13px;
        margin-bottom: 4px;
      }

      .shark-desc {
        font-size: 11px;
        color: #b9d4e8;
        margin: 0;
      }

      .menu-note {
        margin: 8px 0 12px;
        color: #d7e8f4;
        font-size: 12px;
      }

      .setting-row {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 4px 0;
      }

      .setting-row label {
        font-size: 12px;
        color: #d4ecff;
      }

      .setting-select {
        min-width: 170px;
        padding: 6px 8px;
        border-radius: 10px;
        border: 1px solid rgba(95, 216, 255, 0.4);
        background: rgba(5, 22, 34, 0.95);
        color: #f2f8ff;
        font-family: inherit;
        font-size: 12px;
      }

      .result {
        margin-top: 8px;
        color: #f3f8ff;
      }

      .pad {
        display: none;
        margin-top: 8px;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: min(240px, 84vw);
        margin-left: auto;
        margin-right: auto;
        touch-action: none;
        justify-content: center;
        justify-items: center;
        align-items: center;
        grid-template-areas:
          ". up ."
          "left . right"
          ". down .";
      }

      .pad button {
        border: 0;
        border-radius: 14px;
        padding: 12px 0;
        background: linear-gradient(180deg, #f2da84, #e9a14f);
        font-family: inherit;
        font-size: 22px;
        font-weight: 700;
        color: #122f45;
        min-height: 56px;
        min-width: 56px;
        user-select: none;
        -webkit-user-select: none;
        width: 100%;
        max-width: 78px;
      }

      #up {
        grid-area: up;
      }

      #left {
        grid-area: left;
      }

      #down {
        grid-area: down;
      }

      #right {
        grid-area: right;
      }

      .pad button:active {
        transform: translateY(1px);
      }

      .result-actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-top: 12px;
      }

      .small {
        font-size: 11px;
        color: #bcd3e8;
      }

      .panel .small {
        font-size: 9px;
        line-height: 1.1;
      }

      .fish-spawn-hint {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        z-index: 3;
        pointer-events: none;
        opacity: 0;
        background: rgba(8, 33, 54, 0.9);
        border: 2px solid #8cd7ff;
        color: #ddf2ff;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        transition: opacity 0.25s ease;
      }

      .fish-spawn-hint.show {
        opacity: 1;
        animation: fishSpawnPulse 1.6s ease-in-out infinite;
      }

      .tile.fish.fish-coming .entity {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        animation: fishBubble 0.7s ease-out forwards;
      }

      @keyframes fishSpawnPulse {
        0% {
          transform: translate(-50%, 0) scale(0.97);
        }
        50% {
          transform: translate(-50%, 0) scale(1.03);
        }
        100% {
          transform: translate(-50%, 0) scale(0.97);
        }
      }

      @keyframes fishBubble {
        from {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.2;
        }
        to {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }

      .setting-check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #d4ecff;
        font-size: 11px;
      }

      .setting-check input[type='checkbox'] {
        accent-color: #7de2ff;
        width: 16px;
        height: 16px;
      }

      @media (max-width: 760px) {
        .title {
          font-size: clamp(20px, 8vw, 30px);
        }

        .hud {
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 3px;
        }

        .panel {
          padding: 5px 6px;
        }

        .panel .value {
          font-size: 14px;
          min-height: 1.05em;
        }

        .panel .label {
          font-size: 10px;
        }

        .actions .btn {
          min-height: 30px;
          font-size: 13px;
          flex: 1 1 90px;
        }

        .pad {
          display: grid;
          width: min(260px, 94vw);
          max-width: 260px;
          margin-top: 14px;
          gap: 6px;
        }

        .pad button {
          min-height: 52px;
          min-width: 52px;
          font-size: 22px;
        }

        .shark-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tile.you .entity,
        .tile.fish .entity {
          animation: none;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.92);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.12);
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translate(-50%, -50%);
        }
        50% {
          transform: translate(-50%, -50%) translateY(-3px);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">Shark Attack</h1>
      <div class="actions">

      function makeSharkArt(colors) {

      function activeSharkPower() {

      const difficultyTiers = {

      const state = {
        selectedShark: 'tiger',
        difficulty: 'medium',
        easyMode: false,
        fishGoalMultiplier: 1,
        fishSpeedMultiplier: 1,
        bestScore: 0,
        score: 0,
        level: 1,
        fishGoal: 3,
        fishCaught: 0,
        fishTotal: 0,
        fishScore: 0,
        levelScore: 0,
        chain: 0,
        levelStart: 0,
        running: false,
        paused: false,
        awaitingNext: false,
        runStart: 0,
        tick: 0,
        rows: 0,
        cols: 0,
        maze: [],
        tileEls: [],
        player: { x: 1, y: 1 },
        fish: [],
        fishMoveCounter: 0,
        fishMoveEvery: 7,
        fishWallBypass: 0,
        orcaPressure: 0,
        orca: null,
        orcaSpawned: false,
        orcaSpawnTime: 0,

        orcaMoveEvery: 8,

        feedbackText: '',
        feedbackUntil: 0,
        fishSpawnAt: 0,
        fishSpawnPending: false,
        fishSpawnDelayMs: FISH_SPAWN_DELAY_MS,
        redFishCaught: 0,
        fishIdCounter: 1,
        nextPoisonAt: 0,
        runHighestLevel: 1,
        playerMoveEvery: 2,
        currentDir: { x: 0, y: 0 },

        turnCooldown: 0,

        resumeAfterSharkChange: false,
        resumeSharkLevel: 1,
      }

      let lastTouch = null

      function idx(x, y) {
        return `${x},${y}`
      }

      function tileIndex(x, y) {
        return y * state.cols + x
      }

      function inBounds(x, y) {
        return x >= 0 && y >= 0 && x < state.cols && y < state.rows
      }

      function manhattan(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y)
      }

      function randomInt(max) {
        return Math.floor(Math.random() * max)
      }

      function shortestDistanceToPlayer(start) {
        if (!state.player) return Infinity
        const targetKey = idx(state.player.x, state.player.y)
        const queue = [{ ...start }]
        const distanceMap = new Map()
        distanceMap.set(idx(start.x, start.y), 0)

        for (let head = 0; head < queue.length; head += 1) {
          const current = queue[head]
          const currentKey = idx(current.x, current.y)
          const distance = distanceMap.get(currentKey)
          if (currentKey === targetKey) return distance
          for (const dir of Object.values(directions)) {
            const nx = current.x + dir.x
            const ny = current.y + dir.y
            if (!inBounds(nx, ny)) continue
            if (state.maze[ny][nx] === 1) continue
            const key = idx(nx, ny)
            if (distanceMap.has(key)) continue
            distanceMap.set(key, distance + 1)
            queue.push({ x: nx, y: ny })
          }
        }

        return Infinity
      }

      function isPoisonedFish(fish, now = performance.now()) {
        return fish && fish.poisonUntil != null && now < fish.poisonUntil
      }

      function clearExpiredPoison(now = performance.now()) {
        if (!state.fish.length) return
        for (const fish of state.fish) {
          if (fish.poisonUntil && now >= fish.poisonUntil) {
            delete fish.poisonUntil
          }
        }
      }

      function updatePoisonFish(now = performance.now()) {
        clearExpiredPoison(now)
        if (now < state.nextPoisonAt) return

        const candidates = state.fish.filter((fish) => !isPoisonedFish(fish, now))
        if (!candidates.length) {
          state.nextPoisonAt = now + POISON_INTERVAL_MS
          return
        }

        const target = candidates[randomInt(candidates.length)]
        target.poisonUntil = now + RED_POISON_WINDOW_MS
        state.nextPoisonAt = now + POISON_INTERVAL_MS
      }

      function shuffle(items) {
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[items[i], items[j]] = [items[j], items[i]]
        }
        return items
      }

      function buildSharkMenu() {
        const order = ['tiger', 'bull', 'greatWhite', 'hammerhead', 'lemon']
        sharkGrid.innerHTML = ''
        order.forEach((id) => {
          const shark = sharkCatalog[id]
          const button = document.createElement('button')
          button.type = 'button'
          button.className = 'shark-btn'
          button.innerHTML = `<div class="shark-title">${shark.longName}</div><p class="shark-desc">${shark.blurb}</p>`
          button.addEventListener('click', () => selectShark(id))
          sharkGrid.appendChild(button)
        })
        selectShark(state.selectedShark)
      }

      function selectShark(id) {
        const order = ['tiger', 'bull', 'greatWhite', 'hammerhead', 'lemon']
        state.selectedShark = id
        Array.from(sharkGrid.children).forEach((button, index) => {
          button.classList.toggle('selected', index === order.indexOf(id))
        })
        updateSharkPowerHUD()
      }

      function dimensionsForLevel(level) {
        const growth = Math.floor((level - 1) / 2)
        const compact = window.innerWidth < 860
        const ease = state.easyMode ? -1 : 0
        let rows = (compact ? 15 : 13) + growth + ease
        let cols = (compact ? 18 : 25) + growth + ease
        if (rows % 2 === 0) rows += 1
        if (cols % 2 === 0) cols += 1
        return { rows, cols }
      }

      function fishGoal(level) {
        const tier = difficultyTiers[state.difficulty] || difficultyTiers.medium
        const base = 2 + (level - 1)
        const total = base * state.fishGoalMultiplier * tier.fishGoal
        return Math.max(2, Math.round(total))
      }

      function syncSettings() {
        state.difficulty = difficultySelect.value || 'medium'
        state.fishGoalMultiplier = Number(fishGoalSelect.value || 1)
        state.fishSpeedMultiplier = Number(fishSpeedSelect.value || 1)
        state.easyMode = easyModeToggle.checked
      }

      function formatRunSummaryText() {
        const elapsedMs = state.runStart ? performance.now() - state.runStart : 0
        const totalSec = Math.max(0, Math.floor(elapsedMs / 1000))
        const mins = Math.floor(totalSec / 60)
        const secs = String(totalSec % 60).padStart(2, '0')
        return `Fish caught: ${state.fishTotal} · Red fish: ${state.redFishCaught} · Time: ${mins}:${secs} · Lives: ${state.playerLives} · Best level: ${state.runHighestLevel}`
      }

      function queueFishArrival() {
        state.fishSpawnDelayMs = state.easyMode ? FISH_SPAWN_DELAY_EASY_MS : FISH_SPAWN_DELAY_MS
        state.fishSpawnAt = performance.now() + state.fishSpawnDelayMs
        state.fishSpawnPending = true
      }

      function updateFishSpawnHint() {
        if (!fishSpawnHintEl) return
        if (state.fishSpawnPending && state.fishSpawnAt) {
          const seconds = Math.max(0, Math.ceil((state.fishSpawnAt - performance.now()) / 1000))
          fishSpawnHintEl.classList.add('show')
          fishSpawnHintEl.textContent = `New fish arrive in ${seconds}s`
        } else {
          fishSpawnHintEl.classList.remove('show')
          fishSpawnHintEl.textContent = ''
        }
      }

      function activateFishWave() {
        if (!state.fishSpawnPending) return
        state.fishSpawnPending = false
        state.fishSpawnAt = 0
        updateFishSpawnHint()
        setFeedback('New fish are in the water')
      }

      function applyEntityScale() {
        const sharkSize = state.easyMode ? 220 : 240
        const fishSize = state.easyMode ? 205 : 225
        const orcaSize = state.easyMode ? 220 : 235
        board.style.setProperty('--shark-size', `${sharkSize}%`)
        board.style.setProperty('--fish-size', `${fishSize}%`)
        board.style.setProperty('--orca-size', `${orcaSize}%`)
      }

      function initBoardGrid() {
        const { rows, cols } = dimensionsForLevel(state.level)
        state.rows = rows
        state.cols = cols
        state.maze = []
        state.tileEls = []
        board.innerHTML = ''

        const compact = window.innerWidth < 860
        const viewHeight = window.visualViewport && window.visualViewport.height ? window.visualViewport.height : window.innerHeight
        const reservedHeight = 360
        const availableHeight = Math.max(160, viewHeight - reservedHeight)
        const cellByWidth = boardWrap.clientWidth / cols
        const cellByHeight = availableHeight / rows
        const minCell = compact ? 11 : 24
        const maxCell = compact ? 24 : 64
        const cellX = Math.floor(Math.max(minCell, Math.min(maxCell, Math.min(cellByWidth, cellByHeight))))

        board.style.gridTemplateColumns = `repeat(${cols}, var(--size))`
        board.style.setProperty('--size', `${cellX}px`)
        applyEntityScale()

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const tile = document.createElement('div')
            tile.className = 'tile'
            state.tileEls.push(tile)
            board.appendChild(tile)
          }
        }
      }

      function clearToWalls() {
        state.maze = Array.from({ length: state.rows }, (_, y) =>
          Array.from({ length: state.cols }, (_, x) => (x === 0 || y === 0 || x === state.cols - 1 || y === state.rows - 1 ? 1 : 0)),
        )
      }

      function collectReachable(start) {
        const queue = [start]
        const seen = new Set([idx(start.x, start.y)])
        let head = 0
        while (head < queue.length) {
          const cur = queue[head++]
          for (const dir of Object.values(directions)) {
            const nx = cur.x + dir.x
            const ny = cur.y + dir.y
            if (!inBounds(nx, ny)) continue
            if (state.maze[ny][nx] === 1) continue
            const k = idx(nx, ny)
            if (seen.has(k)) continue
            seen.add(k)
            queue.push({ x: nx, y: ny })
          }
        }
        return seen
      }

      function collectOpenFromSet(openSet, exclude = new Set()) {
        const open = []
        for (const key of openSet) {
          if (!exclude.has(key)) {
            const [x, y] = key.split(',').map(Number)
            open.push({ x, y })
          }
        }
        return open
      }

      function randomOpenFromSet(openSet, exclude = new Set()) {
        const open = collectOpenFromSet(openSet, exclude)
        if (!open.length) return null
        return open[randomInt(open.length)]
      }

      function randomOpen() {
        const openSet = new Set()
        for (let y = 1; y < state.rows - 1; y++) {
          for (let x = 1; x < state.cols - 1; x++) {
            if (state.maze[y][x] === 0) openSet.add(idx(x, y))
          }
        }
        return randomOpenFromSet(openSet)
      }

      function addReefClusters() {
        const target = Math.floor((state.rows * state.cols) * (0.11 + Math.min(0.14, state.level * 0.01)))
        for (let i = 0; i < target; i++) {
          let cx = 2 + randomInt(state.cols - 4)
          let cy = 2 + randomInt(state.rows - 4)
          const path = 2 + randomInt(8)
          for (let s = 0; s < path; s++) {
            state.maze[cy][cx] = 1
            const dir = randomInt(4)
            if (dir === 0 && cx < state.cols - 2) cx += 1
            if (dir === 1 && cx > 1) cx -= 1
            if (dir === 2 && cy < state.rows - 2) cy += 1
            if (dir === 3 && cy > 1) cy -= 1
          }
        }
      }

      function addCorridorPaths() {
        const lanes = 4 + Math.floor(state.level / 2)
        for (let i = 0; i < lanes; i++) {
          let cx = 1 + randomInt(state.cols - 2)
          let cy = 1 + randomInt(state.rows - 2)
          const steps = Math.max(state.rows, state.cols)
          for (let s = 0; s < steps; s++) {
            state.maze[cy][cx] = 0
            const dir = randomInt(4)
            if (dir === 0 && cx < state.cols - 2) cx += 1
            if (dir === 1 && cx > 1) cx -= 1
            if (dir === 2 && cy < state.rows - 2) cy += 1
            if (dir === 3 && cy > 1) cy -= 1
          }
        }
      }

      function ensureOpen() {
        for (let x = 0; x < state.cols; x++) {
          state.maze[1][x] = 0
          state.maze[state.rows - 2][x] = 0
        }
        for (let y = 0; y < state.rows; y++) {
          state.maze[y][1] = 0
          state.maze[y][state.cols - 2] = 0
        }
      }

      function carveSafeZone(center, radius = 1) {
        for (let y = center.y - radius; y <= center.y + radius; y++) {
          for (let x = center.x - radius; x <= center.x + radius; x++) {
            if (inBounds(x, y)) {
              state.maze[y][x] = 0
            }
          }
        }
      }

      function chooseZones(cellSet, count) {
        const list = [...cellSet]
        const zones = []
        while (zones.length < count && list.length) {
          zones.push(list[randomInt(list.length)])
          list.splice(randomInt(list.length), 1)
        }
        return zones.map((key) => {
          const [x, y] = key.split(',').map(Number)
          return { x, y }
        })
      }

      function placeEntities() {
        const openSet = new Set()
        for (let y = 1; y < state.rows - 1; y++) {
          for (let x = 1; x < state.cols - 1; x++) {
            if (state.maze[y][x] === 0) openSet.add(idx(x, y))
          }
        }

        const candidateStart = randomOpenFromSet(openSet)
        if (!candidateStart) return false
        state.player = candidateStart
        state.playerStart = { ...candidateStart }
        const bubble = Math.max(1, 2 - Math.floor(state.orcaPressure / 4))
        carveSafeZone(state.player, state.easyMode ? bubble : Math.max(1, bubble - 1))

        const reachable = collectReachable(state.player)
        const need = fishGoal(state.level)
        if (reachable.size < need + 6) return false

        const exclude = new Set([idx(state.player.x, state.player.y)])
        const fishZones = chooseZones(reachable, Math.min(3, need))
        state.fish = []

        let guard = 0
        for (let i = 0; i < need; i++) {
          const zone = fishZones[i % fishZones.length]
          let candidate = randomOpenFromSet(reachable, exclude)
          if (!candidate) return false
          let retries = 0
        while (retries < 22 && (manhattan(candidate, state.player) < 2 || manhattan(candidate, zone) > 4 && manhattan(candidate, zone) < 12)) {
            candidate = randomOpenFromSet(reachable, exclude)
            retries++
            if (!candidate) break
          }
          if (!candidate) return false
          const id = state.fishIdCounter
          state.fish.push({
            x: candidate.x,
            y: candidate.y,
            kind: 'normal',
            id,
            dir: { x: 0, y: 0 },
          })
          state.fishIdCounter += 1
          exclude.add(idx(candidate.x, candidate.y))
          guard++
          if (guard > 500) return false
        }

        return true
      }

      function startLevel() {
        initBoardGrid()
        let attempts = 0
        let ok = false
        while (!ok && attempts < 15) {
          clearToWalls()
          addReefClusters()
          addCorridorPaths()
          ensureOpen()
          ok = placeEntities()
          attempts += 1
        }
        if (!ok) {
          clearToWalls()
          addCorridorPaths()
          ensureOpen()
          placeEntities()
        }

        state.fishGoal = fishGoal(state.level)
        state.fishCaught = 0
        state.fishMoveCounter = 0
        state.orca = null
        state.orcaSpawned = false
        state.orcaSpawnTime = 0
        state.orcaMoveCounter = 0
        state.orcaMoveEvery = 0
        state.currentDir = { x: 0, y: 0 }
        state.nextDir = { x: 0, y: 0 }
        state.turnCooldown = 0
        state.orcaDir = { x: 0, y: 0 }
        state.nextPoisonAt = performance.now() + POISON_INTERVAL_MS
        state.fish.forEach((fish) => {
          if (fish.poisonUntil) delete fish.poisonUntil
        })
        setupDifficulty()
      }

      function setupDifficulty() {
        const tier = difficultyTiers[state.difficulty] || difficultyTiers.medium
        const shark = sharkCatalog[state.selectedShark]
        const basePlayer = 6 - shark.speed
        state.playerMoveEvery = Math.max(1, Math.round(basePlayer * tier.playerDelay))
        const baseFish = 9 - Math.floor(shark.speed / 2)
        const levelBoost = Math.floor(state.level / 2)
        const easyFishPenalty = state.easyMode ? 1.25 : 1
        state.fishMoveEvery = Math.max(2, Math.round((baseFish + levelBoost) * tier.fishDelay * state.fishSpeedMultiplier * easyFishPenalty))
        const orcaMoveDelay = {
          easy: 2.7,
          medium: 2.2,
          hard: 1.8,
          extreme: 1.5,
        }
        const pressure = Math.min(5, state.orcaPressure || 0)
        const pressureTighten = 1 - Math.min(0.35, pressure * 0.05)
        let orcaMoveDelayValue = orcaMoveDelay[state.difficulty] || 2.2
        if (state.easyMode) orcaMoveDelayValue *= 1.35
        state.orcaMoveEvery = Math.max(3, Math.ceil(state.playerMoveEvery * orcaMoveDelayValue * pressureTighten))
        state.orcaSpawnDelayMs = state.easyMode ? ORCA_SPAWN_DELAY_EASY_MS : ORCA_SPAWN_DELAY_MS
      }

      function spawnOrca() {
        if (!state.player || !state.maze.length) return
        const best = selectOrcaSpawnPoint()
        if (!best) return

        state.orca = best
        state.orcaSpawned = true
        state.orcaSpawnTime = performance.now()
        state.orcaWarned = false
        state.orcaMoveCounter = 0
        state.orcaDir = { x: 0, y: 0 }
        warningEl.textContent = 'An orca has entered the area and is hunting you.'
      }

      function selectOrcaSpawnPoint() {
        if (!state.player || !state.maze.length) return null
        const reachable = collectReachable(state.player)
        const fishSet = new Set(state.fish.map((fish) => idx(fish.x, fish.y)))
        const playerKey = idx(state.player.x, state.player.y)

        let options = []
        for (const key of reachable) {
          if (key === playerKey || fishSet.has(key)) continue
          const [x, y] = key.split(',').map(Number)
          options.push({ x, y })
        }

        if (!options.length) {
          options = collectOpenFromSet(reachable, new Set([playerKey]))
        }

        if (!options.length) return
        const baseMinDistance = {
          easy: 12,
          medium: 10,
          hard: 9,
          extreme: 8,
        }[state.difficulty || 'medium']

        const tighten = Math.min(3, Math.floor((state.orcaPressure || 0) / 2))
        const minDistance = Math.max(4, baseMinDistance - tighten)

        const farSafe = options.filter((candidate) => manhattan(candidate, state.player) >= minDistance)
        const candidateList = farSafe.length ? farSafe : options

        let best = candidateList[0]
        let bestDistance = -1
        for (const candidate of candidateList) {
          const distance = manhattan(candidate, state.player)
          if (distance > bestDistance) {
            bestDistance = distance
            best = candidate
          }
        }
        return best
      }

      function resetOrcaAfterLifeLoss() {
        const pick = selectOrcaSpawnPoint()
        if (pick) {
          state.orca = pick
          state.orcaWarned = false
          state.orcaMoveCounter = 0
          state.orcaDir = { x: 0, y: 0 }
        }
      }

      function moveOrca() {
        if (!state.orca || !state.player) return
        const candidates = []
        for (const dir of Object.values(directions)) {
          const nx = state.orca.x + dir.x
          const ny = state.orca.y + dir.y
          if (!inBounds(nx, ny)) continue
          if (state.maze[ny][nx] === 1) continue
          const pathDistance = shortestDistanceToPlayer({ x: nx, y: ny })
          const manhattanDistance = manhattan({ x: nx, y: ny }, state.player)
          candidates.push({ x: nx, y: ny, pathDistance, manhattanDistance })
        }

        if (!candidates.length) return

        const smartChance = {
          easy: 0.45,
          medium: 0.65,
          hard: 0.78,
          extreme: 0.9,
        }
        const isSmart = Math.random() < (smartChance[state.difficulty] || 0.65)
        let chosen

        if (isSmart) {
          const reachable = candidates.filter((candidate) => candidate.pathDistance !== Infinity)
          const validChoices = reachable.length ? reachable : candidates
          let bestDistance = validChoices[0].pathDistance
          for (const option of validChoices) {
            if (option.pathDistance < bestDistance) {
              bestDistance = option.pathDistance
            }
          }
          let bestChoices = validChoices.filter((candidate) => candidate.pathDistance === bestDistance)
          const avoidReverse = bestChoices.filter(
            (candidate) => !(candidate.x - state.orca.x === -state.orcaDir.x && candidate.y - state.orca.y === -state.orcaDir.y),
          )
          if (avoidReverse.length) {
            bestChoices = avoidReverse
          }
          bestChoices.sort((a, b) => a.manhattanDistance - b.manhattanDistance)
          chosen = bestChoices[randomInt(bestChoices.length)]
        } else {
          const straightChoices = candidates.filter(
            (candidate) => !(candidate.x - state.orca.x === -state.orcaDir.x && candidate.y - state.orca.y === -state.orcaDir.y),
          )
          const pool = straightChoices.length ? straightChoices : candidates
          chosen = pool[randomInt(pool.length)]
        }

        if (!chosen) {
          chosen = candidates[randomInt(candidates.length)]
        }

        const prevOrcaX = state.orca.x
        const prevOrcaY = state.orca.y
        state.orca.x = chosen.x
        state.orca.y = chosen.y
        state.orcaDir = { x: state.orca.x - prevOrcaX, y: state.orca.y - prevOrcaY }
      }

      function checkOrcaCatch() {
        if (!state.orca || !state.player) return false
        const distance = manhattan(state.orca, state.player)

        if (distance <= 2 && !state.orcaWarned) {
          state.orcaWarned = true
          setFeedback(`Orca warning: ${distance === 1 ? 'very close' : 'closing in'} keep moving`, 1800)
          return false
        }

        if (distance <= 2 && state.orcaWarned && distance > 0) {
          return false
        }

        if (state.orcaWarned && distance === 0) {
          if (state.playerLives > 1) {
            loseLifeByOrca()
            return false
          }
          endRunByOrca()
          return true
        }

        if (!state.orcaWarned) {
          return false
        }

        if (distance > 3) {
          state.orcaWarned = false
        }
        return false
      }

      function loseLifeByOrca() {
        state.playerLives -= 1
        state.orcaWarned = false
        setFeedback(`Shark escaped once. Lives left: ${state.playerLives}`, 1800)
        warningEl.textContent = 'Orca caught you, but you still have one life.'
        state.player = state.playerStart ? { ...state.playerStart } : { x: 1, y: 1 }
        if (state.orca) {
          resetOrcaAfterLifeLoss()
        } else {
          spawnOrca()
        }
      }

      function endRunByPoison() {
        state.running = false
        state.paused = false
        state.awaitingNext = false
        state.orcaSpawned = false
        warningEl.textContent = ''
        if (state.score > state.bestScore) {
          state.bestScore = state.score
        }
        if (bestScoreEl) bestScoreEl.textContent = String(state.bestScore)
        resultTitle.textContent = 'Poisoned'
        resultText.textContent = `A red fish poisoned the shark on level ${state.level}.`
        resultSub.innerHTML = `You can restart the run for another try.<br><br><strong>Run summary</strong><br>${formatRunSummaryText()}`
        overlay.classList.add('show')
      }

      function loseLifeByPoison() {
        state.playerLives -= 1
        setFeedback(`Poison hit. Lives left: ${state.playerLives}`, 1700)
        warningEl.textContent = 'Poison fish hit you. Avoid red fish on timer.'
        state.orcaWarned = false
        state.chain = 0
        if (state.playerLives <= 0) {
          endRunByPoison()
          return true
        }
        state.player = state.playerStart ? { ...state.playerStart } : { x: 1, y: 1 }
        if (state.orca) {
          resetOrcaAfterLifeLoss()
        } else {
          spawnOrca()
        }
        return false
      }

      function setFeedback(message, ttlMs = 1300) {
        state.feedbackText = message
        state.feedbackUntil = performance.now() + ttlMs
      }

      function endRunByOrca() {
        state.running = false
        state.paused = false
        state.awaitingNext = false
        state.orcaSpawned = false
        warningEl.textContent = ''
        if (state.score > state.bestScore) {
          state.bestScore = state.score
        }
        if (bestScoreEl) bestScoreEl.textContent = String(state.bestScore)
        resultTitle.textContent = 'Shark hunted'
        resultText.textContent = `The orca has caught the shark on level ${state.level}.`
        resultSub.innerHTML = `You can restart the run for a fresh chase.<br><br><strong>Run summary</strong><br>${formatRunSummaryText()}`
        overlay.classList.add('show')
      }

      function queueTouchDirection(event) {
        const touch = event.touches && event.touches[0] ? event.touches[0] : null
        if (!touch) return
        lastTouch = { x: touch.clientX, y: touch.clientY }
      }

      function applyTouchDirection(event) {
        if (!lastTouch) return
        const touch = event.changedTouches && event.changedTouches[0] ? event.changedTouches[0] : null
        if (!touch) return
        const dx = touch.clientX - lastTouch.x
        const dy = touch.clientY - lastTouch.y
        if (Math.abs(dx) >= Math.abs(dy)) {
          if (Math.abs(dx) > 18) setDir(dx > 0 ? 'right' : 'left')
        } else {
          if (Math.abs(dy) > 18) setDir(dy > 0 ? 'down' : 'up')
        }
        lastTouch = null
      }

      function clearTouchDirection() {
        lastTouch = null
      }

      function render() {
        warningEl.textContent = ''
        const now = performance.now()

        for (let y = 0; y < state.rows; y++) {
          for (let x = 0; x < state.cols; x++) {
            const tile = state.tileEls[tileIndex(x, y)]
            const isWall = state.maze[y][x] === 1
            tile.className = 'tile'
            tile.classList.add(isWall ? 'wall' : 'path')
            if (!isWall) {
              const pattern = (x * 17 + y * 31) % 3
              if (pattern === 1) tile.classList.add('path-soft')
              if (pattern === 2) tile.classList.add('path-glow')
            }
            tile.innerHTML = ''
          }
        }

        for (const fish of state.fish) {
          const fishTile = state.tileEls[tileIndex(fish.x, fish.y)]
          const poisoned = isPoisonedFish(fish, now)
          fishTile.classList.add('fish')
          fishTile.classList.toggle('fish-coming', state.fishSpawnPending)
          fishTile.classList.toggle('red', poisoned)
          fishTile.innerHTML = '<span class="entity"></span>'
          const entity = fishTile.querySelector('.entity')
          if (entity) {
            entity.style.backgroundImage = poisoned ? fishArtByType.red : fishArtByType.normal
          }
        }

        if (state.player) {
          const shark = sharkCatalog[state.selectedShark]
          const playerTile = state.tileEls[tileIndex(state.player.x, state.player.y)]
          playerTile.classList.add('you', `you-${state.selectedShark}`)
          playerTile.innerHTML = '<span class="entity"></span>'
          const entity = playerTile.querySelector('.entity')
          if (entity && shark && shark.art) {
            entity.style.backgroundImage = shark.art
          }
        }

        if (state.orca) {
          const orcaTile = state.tileEls[tileIndex(state.orca.x, state.orca.y)]
          orcaTile.classList.add('orca')
          orcaTile.innerHTML = '<span class="entity"></span>'
        }
      }

      function handleOrcaFishCollision() {
        if (!state.orca || !state.fish.length) return false

        const hitIndex = state.fish.findIndex((fish) => fish.x === state.orca.x && fish.y === state.orca.y)
        if (hitIndex < 0) return false

        const consumed = state.fish[hitIndex]
        const isPoison = isPoisonedFish(consumed)
        state.fish.splice(hitIndex, 1)

        if (isPoison) {
          warningEl.textContent = 'Orca ate a poison fish and died'
          setFeedback('Poison fish eliminated the orca', 1400)
          state.orcaSpawned = false
          state.orca = null
          state.orcaWarned = false
          state.orcaMoveCounter = 0
          state.orcaMoveEvery = 0
          state.orcaSpawnTime = 0
          state.orcaDir = { x: 0, y: 0 }
          state.levelStart = performance.now()
          return true
        }

        setFeedback(isPoison ? 'Orca ate a poison fish' : 'Orca ate a fish')
        return false
      }

      function updateHUD() {
        const elapsed = state.runStart ? Math.floor((performance.now() - state.runStart) / 1000) : 0
        state.score = state.fishScore + state.levelScore + Math.floor(elapsed / 2)
        scoreEl.textContent = String(state.score)
        if (bestScoreEl) bestScoreEl.textContent = String(state.bestScore)
        levelEl.textContent = String(state.level)
        fishProgressEl.textContent = `${state.fishCaught} / ${state.fishGoal}`
        runTimeEl.textContent = `${elapsed}s`
        livesEl.textContent = String(state.playerLives)
        const remainingFish = Math.max(0, state.fish.length)
        let statusText = `Fish ${remainingFish} / ${state.fishGoal}`
        const now = performance.now()
        if (state.orcaSpawned) statusText = `${statusText} · Orca hunting`
        if (state.orca && state.player) {
          const dist = manhattan(state.orca, state.player)
          if (dist <= 2) {
            statusText = `Orca warning: ${dist === 1 ? 'very close' : 'nearby'}`
          }
        }
        if (state.feedbackText && now < state.feedbackUntil) {
          statusText = state.feedbackText
        }
        if (statsDetailsEl) statsDetailsEl.textContent = statusText
      }

      function moveFish() {
        const pending = new Set()
        const nextFish = []
        const playerPos = state.player

        for (const fish of state.fish) {
          const occupied = new Set(state.fish.map((f) => idx(f.x, f.y)).filter((k) => !pending.has(k)))
          const options = []
          for (const dir of Object.values(directions)) {
            const nx = fish.x + dir.x
            const ny = fish.y + dir.y
            if (!inBounds(nx, ny)) continue
            if (state.maze[ny][nx] === 1) continue
            const key = idx(nx, ny)
            if (occupied.has(key) || pending.has(key)) continue
            let openAround = 0
            let forwardPaths = 0
            for (const escape of Object.values(directions)) {
              const ex = nx + escape.x
              const ey = ny + escape.y
              if (!inBounds(ex, ey)) continue
              if (state.maze[ey][ex] === 0) openAround += 1
              if (Math.abs(playerPos.x - ex) + Math.abs(playerPos.y - ey) > Math.abs(playerPos.x - fish.x) + Math.abs(playerPos.y - fish.y)) {
                forwardPaths += 1
              }
            }
            const isReverse = fish.dir && fish.dir.x === -dir.x && fish.dir.y === -dir.y
            options.push({
              x: nx,
              y: ny,
              distance: manhattan({ x: nx, y: ny }, playerPos),
              escape: openAround,
              forwardPaths,
              isReverse,
              dir: { x: dir.x, y: dir.y },
            })
          }
          if (!options.length) {
            nextFish.push({ ...fish, dir: fish.dir || { x: 0, y: 0 } })
            continue
          }
          const movingOptions = options.filter((option) => !(option.isReverse && options.length > 1))
          const bestSet = movingOptions.length ? movingOptions : options
          bestSet.sort((a, b) => {
            if (b.escape !== a.escape) return b.escape - a.escape
            if (b.distance !== a.distance) return b.distance - a.distance
            if (b.forwardPaths !== a.forwardPaths) return b.forwardPaths - a.forwardPaths
            return 0
          })
          const top = bestSet[0]
          const tied = bestSet.filter(
            (candidate) => candidate.escape === top.escape && candidate.distance === top.distance && candidate.forwardPaths === top.forwardPaths,
          )
          const selected = tied[randomInt(tied.length)]
          const key = idx(selected.x, selected.y)
          nextFish.push({ ...fish, x: selected.x, y: selected.y, dir: { ...selected.dir } })
          pending.add(key)
        }

        state.fish = nextFish
      }

      function collectIfOnFish() {
        if (state.fishSpawnPending) return false
        const index = state.fish.findIndex((fish) => fish.x === state.player.x && fish.y === state.player.y)
        if (index === -1) return false

        const shark = sharkCatalog[state.selectedShark]
        const caught = state.fish[index]
        const isPoison = isPoisonedFish(caught)
        state.fish.splice(index, 1)
        state.fishCaught += 1
        state.fishTotal += 1

        if (isPoison) state.redFishCaught += 1

        if (isPoison) {
          state.chain = 0
          state.orcaPressure = Math.floor(state.fishTotal / 2)
          const isDead = loseLifeByPoison()
          if (isDead) return true
          setFeedback('Poison fish hit, you lost a life')
        } else {
          state.chain += 1
          state.orcaPressure = Math.floor(state.fishTotal / 2)
          const reward = 24 + state.level * 4 + shark.fishBonus + state.chain
          state.fishScore += reward
          if (state.chain > 1) {
            setFeedback(`Nice combo x${state.chain}`)
          } else {
            setFeedback(isPoison ? 'Poisoned fish caught' : 'Fish caught')
          }
        }

        if (state.fish.length === 0) {
          state.running = false
          state.awaitingNext = true
          state.levelScore += 35 + state.level * 20
          const levelText = `You caught ${state.fishCaught} fish on level ${state.level}`
          setFeedback(`${levelText}. Area clear!`)
          const title = 'Area clear'
          resultTitle.textContent = title
          resultText.textContent = `${levelText}. Nice chase.`
          resultSub.textContent = `Next up: level ${state.level + 1}. Your score is now ${state.fishScore + state.levelScore}.`
          if (state.score > state.bestScore) state.bestScore = state.score
          if (bestScoreEl) bestScoreEl.textContent = String(state.bestScore)
          overlay.classList.add('show')
        }
        return true
      }

      function startRun() {
        syncSettings()
        const resumeProgress = state.resumeAfterSharkChange
        if (!resumeProgress) {
          state.level = 1
          state.fishGoal = fishGoal(state.level)
          state.fishTotal = 0
          state.fishWallBypass = 0
          state.fishScore = 0
          state.levelScore = 0
          state.score = 0
          state.fishCaught = 0
          state.chain = 0
          state.orcaPressure = 0
          state.playerLives = 2
          state.orcaWarned = false
          state.feedbackText = ''
          state.feedbackUntil = 0
          state.redFishCaught = 0
          state.runHighestLevel = 1
        } else {
          state.level = state.resumeSharkLevel
          state.fishGoal = fishGoal(state.level)
          state.fishCaught = 0
          state.fishWallBypass = 0
          state.chain = 0
          state.orcaPressure = 0
          state.orcaWarned = false
          state.feedbackText = ''
          state.feedbackUntil = 0
          if (state.runHighestLevel < state.level) state.runHighestLevel = state.level
        }
        state.runStart = performance.now()
        state.levelStart = performance.now()
        state.running = true
        state.paused = false
        state.awaitingNext = false
        state.fishSpawnPending = false
        state.fishSpawnAt = 0
        state.tick = 0
        state.resumeAfterSharkChange = false
        pauseButton.textContent = 'Pause'
        menu.classList.remove('show')
        overlay.classList.remove('show')

        startLevel()
        queueFishArrival()
        render()
        updateHUD()
        updateFishSpawnHint()
      }

      function endRun() {
        if (!state.running) return
        state.running = false
        state.paused = false
        state.awaitingNext = false
        updateHUD()
        if (state.score > state.bestScore) state.bestScore = state.score
        if (bestScoreEl) bestScoreEl.textContent = String(state.bestScore)
        resultTitle.textContent = 'Run ended'
        resultText.textContent = `You ended the run on level ${state.level}.`
        resultSub.innerHTML = `You can keep fish count, speed, and difficulty for another run.<br><br><strong>Run summary</strong><br>${formatRunSummaryText()}`
        overlay.classList.add('show')
      }

      function continueRun() {
        if (!state.awaitingNext) return
        state.awaitingNext = false
        state.level += 1
        if (state.level > state.runHighestLevel) state.runHighestLevel = state.level
        state.fishCaught = 0
        state.levelStart = performance.now()
        state.fishSpawnPending = false
        state.fishSpawnAt = 0
        startLevel()
        queueFishArrival()
        overlay.classList.remove('show')
        render()
        updateHUD()
        state.running = true
      }

      function setDir(name) {
        const dir = directions[name]
        if (!dir) return
        state.nextDir = { ...dir }
      }

      function attemptPlayerMove() {
        const next = state.nextDir
        if ((next.x === 0 && next.y === 0) || state.turnCooldown > 0) return

        const targetX = state.player.x + next.x
        const targetY = state.player.y + next.y
        if (inBounds(targetX, targetY) && state.maze[targetY][targetX] === 0) {
          state.player.x = targetX
          state.player.y = targetY
          collectIfOnFish()
        }

        state.turnCooldown = state.playerMoveEvery
        state.nextDir = { x: 0, y: 0 }
      }

      function tick() {
        if (!state.running || state.paused) return
        state.tick += 1

        const now = performance.now()
        if (state.turnCooldown > 0) state.turnCooldown -= 1

        if (state.fishSpawnPending && now >= state.fishSpawnAt) {
          activateFishWave()
        }

        attemptPlayerMove()
        updatePoisonFish(now)

        if (
          !state.orcaSpawned &&
          (state.levelStart || state.runStart) &&
          now - (state.levelStart || state.runStart) >= (state.orcaSpawnDelayMs || ORCA_SPAWN_DELAY_MS)
        ) {
          spawnOrca()
        }

        state.fishMoveCounter += 1
        if (!state.fishSpawnPending && state.fishMoveCounter >= state.fishMoveEvery) {
          state.fishMoveCounter = 0
          moveFish()
          if (collectIfOnFish()) {
            // caught a fish after fish repositioning
          }
        }

        if (state.orcaSpawned && state.orca) {
          state.orcaMoveCounter += 1
          if (state.orcaMoveCounter >= state.orcaMoveEvery) {
            state.orcaMoveCounter = 0
            moveOrca()
            if (handleOrcaFishCollision()) {
              render()
              updateHUD()
              updateFishSpawnHint()
              return
            }
            if (checkOrcaCatch()) {
              return
            }
          }
        }

        render()
        updateHUD()
        updateFishSpawnHint()
      }

      window.addEventListener('keydown', (event) => {
        const keyMap = {
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right',
          w: 'up',
          s: 'down',
          a: 'left',
          d: 'right',
        }
        const target = keyMap[event.key]
        if (!target) return
        event.preventDefault()
        setDir(target)
      })

      const bindControl = (button, direction) => {
        const fire = (event) => {
          event.preventDefault()
          if (!state.running) return
          setDir(direction)
        }
        button.addEventListener('click', fire)
        button.addEventListener('pointerdown', fire)
        button.addEventListener('touchstart', fire, { passive: false })
      }

      bindControl(upBtn, 'up')
      bindControl(downBtn, 'down')
      bindControl(leftBtn, 'left')
      bindControl(rightBtn, 'right')

      board.addEventListener(
        'touchstart',
        (event) => {
          if (!state.running || state.awaitingNext || state.paused) return
          event.preventDefault()
          queueTouchDirection(event)
        },
        { passive: false },
      )
      board.addEventListener(
        'touchend',
        (event) => {
          if (!state.running || state.awaitingNext || state.paused) return
          event.preventDefault()
          applyTouchDirection(event)
        },
        { passive: false },
      )
      board.addEventListener('touchcancel', clearTouchDirection, { passive: true })

      startButton.addEventListener('click', startRun)
      startEasyButton.addEventListener('click', startRun)
      continueButton.addEventListener('click', () => {
        if (state.awaitingNext) {
          continueRun()
        } else {
          startRun()
        }
      })

      changeSharkButton.addEventListener('click', () => {
        if (state.awaitingNext) {
          state.resumeAfterSharkChange = true
          state.resumeSharkLevel = state.level + 1
          state.awaitingNext = false
          overlay.classList.remove('show')
          menu.classList.add('show')
          return
        }
        state.running = false
        state.paused = false
        state.awaitingNext = false
        overlay.classList.remove('show')
        menu.classList.add('show')
      })

      backToMenuButton.addEventListener('click', () => {
        if (state.awaitingNext) {
          state.resumeAfterSharkChange = true
          state.resumeSharkLevel = state.level + 1
          state.awaitingNext = false
          overlay.classList.remove('show')
          menu.classList.add('show')
          return
        }
        state.running = false
        state.paused = false
        state.awaitingNext = false
        overlay.classList.remove('show')
        menu.classList.add('show')
      })

      restartButton.addEventListener('click', startRun)
      endRunButton.addEventListener('click', endRun)
      pauseButton.addEventListener('click', () => {
        if (!state.running) return
        state.paused = !state.paused
        pauseButton.textContent = state.paused ? 'Resume' : 'Pause'
      })

      window.addEventListener('resize', () => {
        if (state.running) {
          initBoardGrid()
          startLevel()
          render()
          updateHUD()
        } else {
          initBoardGrid()
          clearToWalls()
          render()
        }
      })

      function init() {
        buildSharkMenu()
        menu.classList.add('show')
        overlay.classList.remove('show')
        updateSharkPowerHUD()
        initBoardGrid()
        clearToWalls()
        render()
        updateHUD()
        updateFishSpawnHint()
        state.timer = setInterval(tick, baseLoopMs)
      }

      init()
    </script>
  </body>
</html>
